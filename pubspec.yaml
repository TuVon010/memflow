name: memflow
description: MemFlow - AI 增强的间隔重复记忆工具，面向程序员面试准备。
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 本地数据库
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # 安全存储
  flutter_secure_storage: ^9.2.2

  # HTTP 客户端
  dio: ^5.4.3+1

  # Markdown 渲染
  flutter_markdown: ^0.7.3+1

  # 图表
  fl_chart: ^0.68.0

  # 本地通知
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # 文件操作
  path_provider: ^2.1.4
  file_picker: ^8.1.3
  share_plus: ^10.0.3

  # UI 工具
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 代码生成
  build_runner: ^2.4.11
  isar_generator: ^3.1.0+1

  # 测试 Mock
  mocktail: ^1.0.4

  # Lint 规则
  flutter_lints: ^4.0.0

  # Riverpod 代码生成（可选）
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  # 资源文件（后续添加）
  # assets:
  #   - assets/images/
  #   - assets/fonts/
